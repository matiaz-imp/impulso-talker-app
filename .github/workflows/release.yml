name: "Release"

# Se publica al empujar una etiqueta (v0.1.0) o a mano desde la pestaña Actions.
# Crea un borrador de release con los instaladores; se revisa y se publica a mano.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      plataformas:
        description: "Qué instaladores generar (los de Mac gastan 10 veces más minutos de GitHub que los de Windows)"
        type: choice
        default: todas
        options:
          - todas
          - solo-windows
          - solo-mac-apple
          - solo-mac-intel

jobs:
  # Elige qué plataformas se compilan: en una etiqueta v* siempre todas.
  matriz:
    runs-on: ubuntu-latest
    outputs:
      incluir: ${{ steps.m.outputs.incluir }}
    steps:
      - id: m
        shell: bash
        env:
          SELECCION: ${{ inputs.plataformas || 'todas' }}
        run: |
          mac_arm='{"platform":"macos-26","args":"--target aarch64-apple-darwin","target":"aarch64-apple-darwin"}'
          mac_x64='{"platform":"macos-latest","args":"--target x86_64-apple-darwin","target":"x86_64-apple-darwin"}'
          win='{"platform":"windows-latest","args":"","target":"x86_64-pc-windows-msvc"}'
          case "$SELECCION" in
            solo-windows) lista="$win" ;;
            solo-mac-apple) lista="$mac_arm" ;;
            solo-mac-intel) lista="$mac_x64" ;;
            *) lista="$mac_arm,$mac_x64,$win" ;;
          esac
          echo "incluir=[$lista]" >> "$GITHUB_OUTPUT"
          echo "Plataformas: [$lista]"

  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: [create-release, matriz]
    strategy:
      fail-fast: false
      matrix:
        # macos-26: Macs con Apple Silicon. macos-latest + x86_64: Macs Intel (compilación cruzada, experimental).
        include: ${{ fromJSON(needs.matriz.outputs.incluir) }}

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false # sin firma de desarrollador (ver README: avisos de macOS y Windows)
      asset-prefix: "impulso-talker"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

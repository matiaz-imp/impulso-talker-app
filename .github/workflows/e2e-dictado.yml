name: "E2E dictado (Mac de pruebas)"

# Prueba de punta a punta del dictado en un Mac de pruebas de GitHub (no en tu computador):
# micrófono virtual (BlackHole) + permisos concedidos en esa máquina desechable + TextEdit.
# Es un experimento: si algo del entorno no se deja, queda en el registro con diagnóstico.
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Instalar la app desde la última release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.prerelease == false)][0].assets[] | select(.name | endswith("aarch64.dmg")) | .id')
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o app.dmg "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id"
          hdiutil attach app.dmg -nobrowse -mountpoint /Volumes/talker
          cp -R "/Volumes/talker/Impulso Talker.app" /Applications/
          hdiutil detach /Volumes/talker
          sw_vers

      - name: Micrófono virtual (BlackHole)
        run: |
          brew install blackhole-2ch switchaudio-osx
          sudo killall coreaudiod || true
          sleep 8
          SwitchAudioSource -a || true
          system_profiler SPAudioDataType | head -40

      - name: Dar permisos en esta máquina de pruebas (Micrófono y Accesibilidad)
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          csreq=$(codesign -d -r- "/Applications/Impulso Talker.app" 2>&1 | grep -o 'designated => .*' | sed 's/designated => //' || true)
          echo "csreq: $csreq"
          sudo sqlite3 "$DB" ".schema access" | head -30 || true
          for s in kTCCServiceMicrophone kTCCServiceAccessibility kTCCServiceListenEvent; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags) VALUES ('$s','cl.agenciaimpulsa.talker',0,2,4,1,0);" && echo "ok $s" || echo "NO se pudo escribir $s"
          done
          sudo sqlite3 "$DB" "select service, client, auth_value from access where client like 'cl.agencia%';" || true

      - name: Preparar modelo y ajustes
        run: |
          d="$HOME/Library/Application Support/cl.agenciaimpulsa.talker"
          mkdir -p "$d/models"
          f=whisper-small-Q5_K_M.gguf
          curl -fL -o "$d/models/$f" "https://huggingface.co/handy-computer/whisper-small-gguf/resolve/c0214bd34be9296695486f838e0142f900803159/$f"
          python3 - "$d/settings_store.json" <<'PY'
          import json, sys
          j = {"settings": {"selected_model": "handy-computer/whisper-small-gguf/whisper-small-Q5_K_M.gguf",
                            "selected_language": "es", "onboarding_completed": True}}
          json.dump(j, open(sys.argv[1], "w"))
          PY

      - name: Dictar una frase (grabar, reproducir, detener)
        continue-on-error: true
        run: |
          SwitchAudioSource -t input -s "BlackHole 2ch" || true
          SwitchAudioSource -t output -s "BlackHole 2ch" || true
          echo "entrada: $(SwitchAudioSource -c -t input)  salida: $(SwitchAudioSource -c -t output)"
          # TextEdit con un documento nuevo, al frente (sin AppleEvents: se abre con un archivo vacío)
          : > "$HOME/prueba-dictado.txt"
          open -a TextEdit "$HOME/prueba-dictado.txt"
          sleep 6
          open "/Applications/Impulso Talker.app" --args --start-hidden
          sleep 25
          APP="/Applications/Impulso Talker.app/Contents/MacOS/handy"
          open -a TextEdit; sleep 2          # vuelve a poner TextEdit al frente para recibir el pegado
          echo "== iniciar grabación"; "$APP" --toggle-transcription; echo "código $?"
          sleep 4
          echo "== reproducir la frase hacia el micrófono virtual"
          if ! afplay tests/fixtures/frase-es.wav; then
            echo "afplay falló; probando con sox"
            brew install sox >/dev/null 2>&1 && play -q tests/fixtures/frase-es.wav || echo "sox también falló"
          fi
          sleep 2
          echo "== detener grabación"; "$APP" --toggle-transcription; echo "código $?"
          sleep 25

      - name: Diagnóstico (registro, historial, pantalla)
        if: always()
        run: |
          echo "--- registro de la app"
          grep -v DEBUG "$HOME/Library/Logs/cl.agenciaimpulsa.talker/handy.log" | tail -45 | cut -c1-240 || true
          echo "--- historial"
          sqlite3 "$HOME/Library/Application Support/cl.agenciaimpulsa.talker/history.db" "select transcription_text from transcription_history order by id desc limit 3;" || true
          echo "--- archivo de prueba (si TextEdit guardó algo)"
          cat "$HOME/prueba-dictado.txt" || true
          screencapture -x e2e-mac.png || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-mac
          path: e2e-mac.png
          if-no-files-found: ignore

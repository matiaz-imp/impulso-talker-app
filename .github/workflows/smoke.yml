name: "Smoke de instaladores"

# Instala la última release (publicada o en borrador) en un Windows / Mac de pruebas de GitHub,
# comprueba que el programa arranca y guarda una captura de pantalla de la ventana.
# No prueba el micrófono ni los permisos (no hay).
on:
  workflow_dispatch:
    inputs:
      mac:
        description: "Probar también los instaladores de Mac, Apple Silicon e Intel (gasta 10 veces más minutos)"
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Instalar con el script de la guía
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/install-windows.ps1 -Repo "${{ github.repository }}" -Silencioso -IncluirBorrador

      - name: Comprobar que arranca y detecta dispositivos de audio
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Impulso Talker\handy.exe"
          if (-not (Test-Path $exe)) { throw "No se instaló en $exe" }
          (Get-Item $exe).VersionInfo | Format-List ProductName, FileDescription, ProductVersion
          # handy.exe es una app de ventana: al llamarla directo PowerShell no espera. Con la tubería sí.
          $salida = (& $exe --list-devices 2>&1 | Out-String)
          $salida
          if ($salida -notmatch "compute device") { throw "--list-devices no listó dispositivos de cómputo" }

      - name: Transcribir una frase en español con un modelo real (motor y modelo, sin micrófono)
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Impulso Talker\handy.exe"
          $d = Join-Path $env:APPDATA "cl.agenciaimpulsa.talker"
          New-Item -ItemType Directory -Force (Join-Path $d "models") | Out-Null
          $f = "whisper-small-Q5_K_M.gguf"
          $ruta = Join-Path $d "models\$f"
          Invoke-WebRequest "https://huggingface.co/handy-computer/whisper-small-gguf/resolve/c0214bd34be9296695486f838e0142f900803159/$f" -OutFile $ruta
          $hash = (Get-FileHash $ruta -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "326cd00c3e7217c751667c7c1600eaf7e0de174e186ca2c16b4bf590251c3c3b") { throw "El modelo descargado no coincide con la suma esperada: $hash" }
          $store = Join-Path $d "settings_store.json"
          $json = if (Test-Path $store) { Get-Content $store -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          if (-not $json.ContainsKey("settings")) { $json["settings"] = @{} }
          $json["settings"]["selected_model"] = "handy-computer/whisper-small-gguf/$f"
          $json["settings"]["selected_language"] = "es"
          $json | ConvertTo-Json -Depth 20 | Set-Content $store -Encoding utf8
          $salida = (& $exe --transcribe-file (Join-Path $PWD "tests\fixtures\frase-es.wav") 2>&1 | Out-String)
          $salida
          if ($salida -notmatch "(?i)reuni[oó]n" -or $salida -notmatch "(?i)tarde") { throw "La transcripción no contiene la frase esperada (reunión ... tarde)" }
          "OK: transcribió la frase en español"

      - name: Abrir la app y capturar la pantalla (3 momentos) con diagnóstico
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Impulso Talker\handy.exe"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Capturar($nombre) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($nombre)
          }
          $wv = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          "WebView2 runtime: $($wv.pv)"
          Start-Process $exe
          Start-Sleep -Seconds 20; Capturar "pantalla-windows-20s.png"
          Start-Sleep -Seconds 40; Capturar "pantalla-windows-60s.png"
          Start-Sleep -Seconds 60; Capturar "pantalla-windows-120s.png"
          Get-Process handy, msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, MainWindowTitle | Format-Table
          Get-ChildItem "$env:APPDATA\cl.agenciaimpulsa.talker", "$env:LOCALAPPDATA\cl.agenciaimpulsa.talker" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".log",".json" } | Select-Object FullName
          $log = Get-ChildItem "$env:APPDATA\cl.agenciaimpulsa.talker", "$env:LOCALAPPDATA\cl.agenciaimpulsa.talker" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { "--- $($log.FullName)"; Get-Content $log.FullName -Tail 40 }

      - name: Desinstalar y comprobar que no quedan restos del programa
        shell: pwsh
        run: |
          Get-Process handy -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $dir = Join-Path $env:LOCALAPPDATA "Impulso Talker"
          $un = Join-Path $dir "uninstall.exe"
          if (-not (Test-Path $un)) { throw "No hay desinstalador en $un" }
          Start-Process $un -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir "handy.exe")) { throw "handy.exe sigue instalado tras desinstalar" }
          "Desinstalado: handy.exe ya no existe"

      - uses: actions/upload-artifact@v7
        with:
          name: pantalla-windows
          path: pantalla-windows-*.png

  mac-apple:
    if: ${{ inputs.mac }}
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Descargar el .dmg de la última release (publicada o en borrador)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.prerelease == false)][0].assets[] | select(.name | endswith("aarch64.dmg")) | .id')
          [ -n "$id" ] || { echo "No hay .dmg de Apple Silicon en la última release"; exit 1; }
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o app.dmg "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id"
          ls -lh app.dmg

      - name: Instalar como lo haría una persona (montar y arrastrar a Aplicaciones)
        run: |
          hdiutil attach app.dmg -nobrowse -mountpoint /Volumes/talker
          ls /Volumes/talker
          cp -R "/Volumes/talker/Impulso Talker.app" /Applications/
          hdiutil detach /Volumes/talker
          codesign -dv "/Applications/Impulso Talker.app" 2>&1 | grep -E "Identifier|Signature" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" -c "Print :CFBundleShortVersionString" "/Applications/Impulso Talker.app/Contents/Info.plist"

      - name: Comprobar que arranca y detecta dispositivos de audio
        run: |
          "/Applications/Impulso Talker.app/Contents/MacOS/handy" --list-devices

      - name: Transcribir una frase en español con un modelo real (motor y modelo, sin micrófono)
        run: |
          d="$HOME/Library/Application Support/cl.agenciaimpulsa.talker"
          mkdir -p "$d/models"
          f=whisper-small-Q5_K_M.gguf
          curl -fL -o "$d/models/$f" "https://huggingface.co/handy-computer/whisper-small-gguf/resolve/c0214bd34be9296695486f838e0142f900803159/$f"
          real=$(shasum -a 256 "$d/models/$f" | awk '{print $1}')
          [ "$real" = "326cd00c3e7217c751667c7c1600eaf7e0de174e186ca2c16b4bf590251c3c3b" ] || { echo "Suma distinta: $real"; exit 1; }
          python3 - "$d/settings_store.json" <<'PY'
          import json, os, sys
          p = sys.argv[1]
          j = json.load(open(p)) if os.path.exists(p) else {}
          j.setdefault("settings", {})
          j["settings"]["selected_model"] = "handy-computer/whisper-small-gguf/whisper-small-Q5_K_M.gguf"
          j["settings"]["selected_language"] = "es"
          json.dump(j, open(p, "w"))
          PY
          salida=$("/Applications/Impulso Talker.app/Contents/MacOS/handy" --transcribe-file tests/fixtures/frase-es.wav 2>&1)
          echo "$salida" | grep -E "^(model|text)" || echo "$salida" | tail -20
          echo "$salida" | grep -i -E "reuni[oó]n" >/dev/null && echo "$salida" | grep -i "tarde" >/dev/null || { echo "No contiene la frase esperada"; exit 1; }
          echo "OK: transcribió la frase en español"

      - name: Abrir la app y capturar la pantalla
        run: |
          open "/Applications/Impulso Talker.app"
          sleep 30
          screencapture -x pantalla-mac.png || true
          pgrep -fl "Impulso Talker" || true
          ls -la pantalla-mac.png || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pantalla-mac
          path: pantalla-mac.png
          if-no-files-found: ignore

  mac-intel:
    if: ${{ inputs.mac }}
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Descargar el .dmg de la última release (publicada o en borrador)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.prerelease == false)][0].assets[] | select(.name | endswith("x64.dmg")) | .id')
          [ -n "$id" ] || { echo "No hay .dmg de Intel en la última release"; exit 1; }
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o app-intel.dmg "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id"
          ls -lh app-intel.dmg

      - name: Instalar como lo haría una persona (montar y arrastrar a Aplicaciones)
        run: |
          hdiutil attach app-intel.dmg -nobrowse -mountpoint /Volumes/talker-intel
          ls /Volumes/talker-intel
          cp -R "/Volumes/talker-intel/Impulso Talker.app" /Applications/
          hdiutil detach /Volumes/talker-intel
          codesign -dv "/Applications/Impulso Talker.app" 2>&1 | grep -E "Identifier|Signature" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" -c "Print :CFBundleShortVersionString" "/Applications/Impulso Talker.app/Contents/Info.plist"

      - name: Comprobar que arranca y detecta dispositivos de audio
        run: |
          "/Applications/Impulso Talker.app/Contents/MacOS/handy" --list-devices

      - name: Abrir la app y capturar la pantalla
        run: |
          open "/Applications/Impulso Talker.app"
          sleep 30
          screencapture -x pantalla-mac-intel.png || true
          pgrep -fl "Impulso Talker" || true
          ls -la pantalla-mac-intel.png || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pantalla-mac-intel
          path: pantalla-mac-intel.png
          if-no-files-found: ignore
